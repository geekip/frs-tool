name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GO_VERSION: "1.24.13"
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Validate tag and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(go version | awk '{print $3}')" = "go${GO_VERSION}"
          env GOTOOLCHAIN=local GOPROXY=off go test -count=1 ./...
          env GOTOOLCHAIN=local GOPROXY=off go vet ./...
          env GOTOOLCHAIN=local GOPROXY=off go test -race -count=1 ./...
      - name: Cross-build and verify all release archives
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; printf "::error title=release build failed::line %s: %s (exit %s)\n" "$LINENO" "$BASH_COMMAND" "$status"' ERR
          export CGO_ENABLED=0 GOTOOLCHAIN=local GOPROXY=off
          mkdir -p assets build smoke unpacked
          go build -trimpath -buildvcs=false -o build/package-release ./cmd/package-release

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
            "freebsd amd64"
            "freebsd arm64"
          )
          for target in "${targets[@]}"; do
            read -r target_os target_arch <<< "$target"
            suffix=""
            if [ "$target_os" = windows ]; then suffix=".exe"; fi
            target_dir="build/$target_os-$target_arch"
            binary="$target_dir/frs$suffix"
            mkdir -p "$target_dir"
            env GOOS="$target_os" GOARCH="$target_arch" go build \
              -trimpath -buildvcs=false \
              -ldflags="-s -w -buildid= -X frs-tool/internal/version.Version=$TAG" \
              -o "$binary" ./cmd/frs-tool
            build_info="$(go version -m "$binary")"
            grep -Fq "CGO_ENABLED=0" <<< "$build_info"
            grep -Fq "GOOS=$target_os" <<< "$build_info"
            grep -Fq "GOARCH=$target_arch" <<< "$build_info"
            build/package-release \
              -version "$TAG" -goos "$target_os" -goarch "$target_arch" \
              -binary "$binary" -out assets
          done

          printf '1.2.3.4\nDOMAIN,example.com\n' > smoke/rules.txt
          printf '{"output":"rules.frs","groups":[{"name":"main","sources":["rules.txt"]}]}\n' > smoke/config.json
          native_bin="build/linux-amd64/frs"
          test "$("$native_bin" version | sed -n '1p')" = "frs $TAG"
          "$native_bin" -c smoke/config.json
          "$native_bin" verify smoke/rules.frs
          "$native_bin" inspect --json smoke/rules.frs

          mapfile -t archives < <(find assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | LC_ALL=C sort)
          test "${#archives[@]}" -eq 8
          for target in "${targets[@]}"; do
            read -r target_os target_arch <<< "$target"
            base="frs-$TAG-$target_os-$target_arch"
            binary_name="frs"
            archive="assets/$base.tar.gz"
            if [ "$target_os" = windows ]; then
              binary_name="frs.exe"
              archive="assets/$base.zip"
              unzip -tqq "$archive"
              mapfile -t entries < <(unzip -Z1 "$archive")
            else
              tar -tzf "$archive" >/dev/null
              mapfile -t entries < <(tar -tzf "$archive")
            fi
            test "${#entries[@]}" -eq 3
            for expected in "$base/$binary_name" "$base/README.md" "$base/config.example.json"; do
              printf '%s\n' "${entries[@]}" | grep -Fxq "$expected"
            done
          done

          tar -xzf "assets/frs-$TAG-linux-amd64.tar.gz" -C unpacked
          archive_bin="unpacked/frs-$TAG-linux-amd64/frs"
          test "$("$archive_bin" version | sed -n '1p')" = "frs $TAG"
          "$archive_bin" verify smoke/rules.frs
          "$archive_bin" inspect --json smoke/rules.frs

          (cd assets && sha256sum "${archives[@]}" | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '::error title=release already exists::GitHub Release %s already exists\n' "$TAG"
            exit 1
          fi
          gh release create "$TAG" assets/* --draft --verify-tag --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
